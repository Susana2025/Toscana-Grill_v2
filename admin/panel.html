<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>
    Panel administrativo | Toscana Grill
  </title>

  <link
    rel="stylesheet"
    href="../css/panel.css?v=7"
  >
</head>

<body>
  <div
    id="app-loading"
    class="app-loading"
  >
    <div class="loader"></div>

    <p>
      Validando sesión…
    </p>
  </div>

  <div
    id="admin-app"
    class="admin-app"
    hidden
  >
    <aside
      id="sidebar"
      class="sidebar"
    >
      <div class="sidebar-brand">
        <span>
          Toscana Grill
        </span>

        <strong>
          Gestión de pedidos
        </strong>
      </div>

      <nav class="sidebar-nav">
        <button
          class="nav-item active"
          data-view="dashboard"
          type="button"
        >
          Dashboard
        </button>

        <button
          class="nav-item"
          data-view="pedidos"
          type="button"
        >
          Pedidos activos
        </button>

        <button
          class="nav-item"
          data-view="cocina"
          data-roles="administrador,cocina"
          type="button"
        >
          Cocina
        </button>

        <button
          class="nav-item"
          data-view="caja"
          data-roles="administrador,caja"
          type="button"
        >
          Caja
        </button>

        <button
          class="nav-item"
          data-view="historial"
          data-roles="administrador,caja,mesero"
          type="button"
        >
          Histórico
        </button>

        <button
          class="nav-item"
          data-view="productos"
          data-roles="administrador"
          type="button"
        >
          Productos
        </button>

        <button
          class="nav-item"
          data-view="usuarios"
          data-roles="administrador"
          type="button"
        >
          Usuarios
        </button>
      </nav>

      <div class="sidebar-footer">
        <a
          href="../index.html?modo=admin"
          target="_blank"
          rel="noopener noreferrer"
        >
          Nuevo pedido
        </a>

        <a
          href="../index.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver menú público
        </a>

        <button
          id="logout-button"
          type="button"
        >
          Cerrar sesión
        </button>
      </div>
    </aside>

    <div
      id="sidebar-overlay"
      class="sidebar-overlay"
    ></div>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-label="Abrir menú lateral"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            ☰
          </button>

          <div>
            <p>
              Panel administrativo
            </p>

            <h1 id="page-title">
              Dashboard
            </h1>
          </div>
        </div>

        <div class="user-box">
          <div
            id="user-avatar"
            class="user-avatar"
          >
            TG
          </div>

          <div>
            <strong id="user-name">
              Usuario
            </strong>

            <span id="user-role">
              Rol
            </span>
          </div>
        </div>
      </header>

      <p
        id="global-message"
        class="global-message"
        hidden
      ></p>

      <div
        id="view-container"
        class="view-container"
      >
        <div class="view-loading">
          <div class="loader"></div>

          <p>
            Cargando módulo…
          </p>
        </div>
      </div>
    </main>
  </div>

  <dialog
    id="order-dialog"
    class="order-dialog"
  >
    <button
      id="close-order-dialog"
      class="dialog-close"
      type="button"
      aria-label="Cerrar detalle del pedido"
    >
      ×
    </button>

    <div id="order-detail-content">
      Cargando…
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../js/supabase-config.js?v=1"></script>
  <script src="../js/supabase-client.js?v=1"></script>

  <script src="../js/shared/utils.js?v=1"></script>
  <script src="../js/shared/realtime.js?v=1"></script>

  <script src="../js/core/view-loader.js?v=1"></script>

  <script src="../js/modules/dashboard.js?v=2"></script>
  <script src="../js/modules/pedidos.js?v=2"></script>
  <script src="../js/modules/cocina.js?v=3"></script>
  <script src="../js/modules/caja.js?v=2"></script>
  <script src="../js/modules/historial.js?v=1"></script>
  <script src="../js/modules/productos.js?v=1"></script>

  <script src="../js/panel.js?v=6"></script>
</body>
</html>
