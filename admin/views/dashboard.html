<section class="dashboard-view" data-view="dashboard">
  <header class="view-header">
    <div>
      <p class="view-eyebrow">Resumen operativo</p>
      <h1>Dashboard</h1>
      <p>Información general de la operación diaria de Toscana Grill.</p>
    </div>
  </header>

  <div class="dashboard-cards">
    <article class="dashboard-card">
      <span>Pedidos activos</span>
      <strong id="dashboardPedidosActivos">0</strong>
    </article>

    <article class="dashboard-card">
      <span>Pedidos de hoy</span>
      <strong id="dashboardPedidosHoy">0</strong>
    </article>

    <article class="dashboard-card">
      <span>Ventas de hoy</span>
      <strong id="dashboardVentasHoy">$0,00</strong>
    </article>

    <article class="dashboard-card">
      <span>Ticket promedio</span>
      <strong id="dashboardTicketPromedio">$0,00</strong>
    </article>
  </div>

  <section class="dashboard-section">
    <div class="section-heading">
      <div>
        <h2>Pedidos recientes</h2>
        <p>Últimos pedidos registrados en el sistema.</p>
      </div>
    </div>

    <div id="dashboardPedidosRecientes" class="dashboard-orders">
      <p class="empty-state">
        Los pedidos recientes se cargarán aquí.
      </p>
    </div>
  </section>
</section>
